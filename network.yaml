# Single source of truth for every port this VPS setup opens, and whether
# it's reachable from the public internet or only over the Tailscale
# interface. Read by lib/common.sh's net_port()/net_access() helpers (via
# yq) and applied wholesale by scripts/02-security-harden.sh's ufw setup -
# see that script and README.md's "Security model" section.
#
# access: public    - open to the whole internet (0.0.0.0/0)
# access: tailscale - open only to traffic arriving on the tailscale0
#                     interface, i.e. reachable only once you've joined
#                     this VPS's tailnet
#
# Each app script still honors its own env var as a per-run override
# (e.g. RANCHER_HTTP_PORT) - that env var name is always the port's
# `name` below, upper-cased, with `_PORT` appended (ssh -> SSH_PORT,
# cockpit_http -> COCKPIT_HTTP_PORT). The values here are just the
# defaults; edit this file to change them for good.

ports:
  - name: ssh
    port: 22
    access: public
    note: "SSH"

  - name: http
    port: 80
    access: public
    note: "HTTP (Traefik ingress; also required for the Let's Encrypt HTTP-01 challenge)"

  - name: https
    port: 443
    access: public
    note: "HTTPS (Traefik ingress)"

  - name: cockpit_http
    port: 9080
    access: tailscale
    app: cockpit

  - name: cockpit_https
    port: 9083
    access: tailscale
    app: cockpit

  - name: rancher_http
    port: 7080
    access: tailscale
    app: rancher

  - name: rancher_https
    port: 7083
    access: tailscale
    app: rancher

  - name: traefik_dashboard
    port: 8088
    access: tailscale
    app: traefik

  - name: argocd_http
    port: 7090
    access: tailscale
    app: argocd

  - name: argocd_https
    port: 7093
    access: tailscale
    app: argocd
