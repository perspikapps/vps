# Rights for Coder's service account (coder:coder) to run workspaces in their own
# namespace: the template creates a Deployment and a PVC (and the builder template
# reads pods/events). ${coder_namespace} is filled in by run.sh.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
    name: coder-workspaces
rules:
    - apiGroups: ['']
      resources: [pods, pods/log, persistentvolumeclaims, services, secrets, configmaps, events]
      verbs: ['*']
    - apiGroups: [apps]
      resources: [deployments, replicasets]
      verbs: ['*']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
    name: coder-workspaces
roleRef:
    apiGroup: rbac.authorization.k8s.io
    kind: Role
    name: coder-workspaces
subjects:
    - kind: ServiceAccount
      name: coder
      namespace: ${coder_namespace}
