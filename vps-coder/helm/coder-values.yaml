# Coder chart values, exposed through k3s's Traefik. ${access_url} and ${host} are
# filled in by run.sh. With a wildcard domain run.sh uses coder-values-wildcard.yaml
# instead (a values file cannot append to a list, so it repeats `env`).
coder:
    env:
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
              secretKeyRef:
                  name: coder-db-url
                  key: url
        - name: CODER_ACCESS_URL
          value: '${access_url}'
    service:
        type: ClusterIP
    ingress:
        enable: true
        className: traefik
        host: '${host}'
        annotations:
            traefik.ingress.kubernetes.io/router.entrypoints: 'web,websecure'
            traefik.ingress.kubernetes.io/router.tls: 'false'
            traefik.ingress.kubernetes.io/router.middlewares: '${middlewares}'
