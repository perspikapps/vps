# coder-values.yaml plus workspace apps on subdomains. The cookie Coder sets is
# scoped to the wildcard domain, so the dashboard host sits under it. ${access_url},
# ${host} and ${wildcard_host} (*.<domain>) are filled in by run.sh.
coder:
    env:
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
              secretKeyRef:
                  name: coder-db-url
                  key: url
        - name: CODER_ACCESS_URL
          value: '${access_url}'
        - name: CODER_WILDCARD_ACCESS_URL
          value: '${wildcard_host}'
    service:
        type: ClusterIP
    ingress:
        enable: true
        className: traefik
        host: '${host}'
        wildcardHost: '${wildcard_host}'
