# @format

name: Publish Helm charts

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add chart dependency repos
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo add epinio https://epinio.github.io/helm-charts/
          helm repo add coder-v2 https://helm.coder.com/v2
          helm repo add infisical https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
          helm repo update

      - name: Build chart dependencies
        run: |
          for chart in charts/*/; do
            helm dependency build "$chart"
          done

      - name: Create gh-pages branch if missing
        run: |
          git ls-remote --exit-code --heads origin gh-pages >/dev/null && exit 0
          git worktree add --orphan -b gh-pages "$RUNNER_TEMP/gh-pages"
          git -C "$RUNNER_TEMP/gh-pages" commit --allow-empty -m 'chore: init gh-pages'
          git -C "$RUNNER_TEMP/gh-pages" push origin gh-pages

      # Not the action's release mode: it only releases charts changed since the
      # latest git tag, which here is the repo's own vX.Y.Z tag, not a chart release.
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1
        with:
          install_only: true

      - name: Package, release and index all charts
        env:
          CR_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
          CR_OWNER: '${{ github.repository_owner }}'
          CR_GIT_REPO: '${{ github.event.repository.name }}'
        run: |
          # charts/_lib is a library chart (helpers for the others, vendored by dependency build): not released
          for chart in charts/*/; do
            [ "$chart" = charts/_lib/ ] || cr package "$chart"
          done
          cr upload --skip-existing
          # cr index writes a temp file in .cr-index/ without creating it (chart-releaser 1.7.0)
          mkdir -p .cr-index
          cr index --push
