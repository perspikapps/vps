# @format

name: 'Update Features'

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-features:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.UPDATE_FEATURES_TOKEN || github.token }}

      - name: Set up Node.js
        uses: tomgrv/actions/setup-node@v4

      - name: Configure git identity
        uses: tomgrv/actions/config-bot@v4

      - name: Update features
        run: npm exec --yes -- tomgrv/devcontainer-features update -a

      - name: Skip workflow changes without a workflows token
        env:
          UPDATE_FEATURES_TOKEN: ${{ secrets.UPDATE_FEATURES_TOKEN }}
        run: |
          # GITHUB_TOKEN cannot push .github/workflows changes. Without the
          # UPDATE_FEATURES_TOKEN secret (token with the workflows permission),
          # drop them from the update and warn instead of failing the push.
          [ -z "$UPDATE_FEATURES_TOKEN" ] || exit 0
          skipped=$(git status --porcelain -- .github/workflows | awk '{print $NF}' | tr '\n' ' ')
          [ -n "$skipped" ] || exit 0
          echo "::warning title=Workflow changes skipped::GITHUB_TOKEN cannot push .github/workflows changes. Set the UPDATE_FEATURES_TOKEN secret (token with the workflows permission) to include them. Skipped: ${skipped}"
          git reset -q HEAD -- .github/workflows
          git checkout -- .github/workflows
          git clean -fdq -- .github/workflows

      - name: Detect changes
        id: changes
        run: |
          echo "has-changes=false" >> "$GITHUB_OUTPUT"
          if ! git diff --quiet -- .; then
            echo "has-changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        if: ${{ steps.changes.outputs.has-changes == 'true' }}
        uses: tomgrv/actions/create-pr@v4
        with:
          github-token: ${{ secrets.UPDATE_FEATURES_TOKEN || secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          head-branch: chore/update-features
          workdir: ${{ github.workspace }}
          commit-message: 'chore: update features'
          pr-title: 'chore: update features'
          pr-body: |
            Automated nightly feature updates.

            Command run:
            - npm exec --yes -- tomgrv/devcontainer-features update -a
