name: ansible-lint

on:
  pull_request:
    paths: [ansible/**, .github/workflows/ansible-lint.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook -i inventory.example.yml site.yml --syntax-check

  molecule:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        distro: [ubuntu2404, fedora40]
    # The firewalld path in a container is unproven: fedora is informative until it passes once.
    continue-on-error: ${{ matrix.distro != 'ubuntu2404' }}
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible molecule molecule-plugins[docker]
      - run: molecule test
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
