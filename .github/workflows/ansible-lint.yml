name: ansible-lint

on:
  pull_request:
    paths: [ansible/**, .github/workflows/ansible-lint.yml]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4
      - run: pip install ansible ansible-lint yamllint
      - run: ansible-galaxy collection install -r requirements.yml
      - run: yamllint .
      - run: ansible-lint
      - run: ansible-playbook -i inventory.example.yml site.yml --syntax-check
