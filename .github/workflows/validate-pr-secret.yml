# @format

name: Validate PR is not leaking secrets

on:
  pull_request:
    types:
      - opened
      - ready_for_review

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  validate-pr-secret:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate PR secrets
        if: ${{ env.GITLEAKS_LICENSE != '' }}
        uses: tomgrv/actions/check-secret@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gitleaks-license: ${{ env.GITLEAKS_LICENSE }}
