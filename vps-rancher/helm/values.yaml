# Chart values that never change. hostname and bootstrapPassword are added by
# run.sh as a second values file (JSON-quoted strings: helm parses a numeric
# password as an integer when it comes through --set).
ingress:
    # Traefik serves the dashboard through ingress.yaml, not the chart's ingress.
    enabled: false
service:
    # Moved to private ports by run.sh once the release exists.
    type: LoadBalancer
replicas: 1
