# Public dashboard through k3s's Traefik. The backend is the Service's "http"
# port by name, so it survives the private-port rebind; Traefik terminates TLS
# (Let's Encrypt) and sends X-Forwarded-Proto, which keeps Rancher from
# redirecting to https again. ${INGRESS_HOST} is filled in by run.sh.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: rancher-traefik
    namespace: cattle-system
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
        traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
    ingressClassName: traefik
    tls:
        - hosts: ['${INGRESS_HOST}']
    rules:
        - host: ${INGRESS_HOST}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: rancher
                            port:
                                name: http
