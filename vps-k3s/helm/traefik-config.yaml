# Traefik (k3s's bundled chart): one ingress on 80/443 for public AND internal services,
# Let's Encrypt, and the dashboard on a private port. Internal services differ only by
# host and by the "internal-only" middleware (internal-middleware.yaml). The client address
# must reach Traefik for that middleware to work, hence externalTrafficPolicy: Local.
# ${TRAEFIK_DASHBOARD_PORT}, ${TRAEFIK_ACME_EMAIL} and ${TRAEFIK_ACME_CASERVER} are filled in by run.sh.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
    name: traefik
    namespace: kube-system
spec:
    valuesContent: |-
        ports:
          traefik:
            port: 9000
            expose:
              default: true
            exposedPort: ${TRAEFIK_DASHBOARD_PORT}
        service:
          spec:
            externalTrafficPolicy: Local
        api:
          dashboard: true
          insecure: true
        persistence:
          enabled: true
          size: 128Mi
        additionalArguments:
          - "--providers.kubernetescrd.allowCrossNamespace=true"
          - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
          - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
          - "--certificatesresolvers.letsencrypt.acme.caserver=${TRAEFIK_ACME_CASERVER}"
