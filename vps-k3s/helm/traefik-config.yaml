# Traefik (k3s's bundled chart): public ingress on 80/443, Let's Encrypt, and
# the dashboard and the "internalsecure" entrypoint on private ports (services set to
# internal access are served there, reachable over Tailscale/Cloudflare only).
# ${TRAEFIK_DASHBOARD_PORT}, ${TRAEFIK_INTERNAL_PORT}, ${TRAEFIK_ACME_EMAIL} and
# ${TRAEFIK_ACME_CASERVER} are filled in by run.sh.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
    name: traefik
    namespace: kube-system
spec:
    valuesContent: |-
        ports:
          traefik:
            port: 9000
            expose:
              default: true
            exposedPort: ${TRAEFIK_DASHBOARD_PORT}
          internalsecure:
            port: ${TRAEFIK_INTERNAL_PORT}
            expose:
              default: true
            asDefault: false
        api:
          dashboard: true
          insecure: true
        persistence:
          enabled: true
          size: 128Mi
        additionalArguments:
          - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL}"
          - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
          - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
          - "--certificatesresolvers.letsencrypt.acme.caserver=${TRAEFIK_ACME_CASERVER}"
