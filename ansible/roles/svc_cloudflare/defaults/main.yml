---
svc_cloudflare_token: "{{ lookup('env', 'CLOUDFLARE_TUNNEL_TOKEN') }}"
# Address WARP clients use to reach this VPS (a /32 on a dummy interface).
svc_cloudflare_internal_ip: "{{ lookup('env', 'CLOUDFLARE_INTERNAL_IP') | default('10.254.254.1', true) }}"
# cloudflared release to pin, e.g. 2025.1.0 (empty = latest) and its sha256 (checked when set).
svc_cloudflare_version: "{{ lookup('env', 'CLOUDFLARE_VERSION') }}"
svc_cloudflare_sha256: "{{ lookup('env', 'CLOUDFLARE_SHA256') }}"
svc_cloudflare_iface: vpscf0
svc_cloudflare_bin: /usr/local/bin/cloudflared
svc_cloudflare_env_file: /etc/cloudflared/tunnel.env
svc_cloudflare_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] | default(ansible_architecture) }}"
