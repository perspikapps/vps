# coder-values.yaml plus workspace apps on subdomains. The cookie Coder sets is
# scoped to the wildcard domain, so the dashboard host sits under it. ${access_url},
# ${host}, ${wildcard_host} (*.<domain>), ${wildcard_url} (the same),
# and ${middlewares} (the internal-only middleware for internal access, else empty) are filled in by run.sh.
coder:
    env:
        - name: CODER_PG_CONNECTION_URL
          valueFrom:
              secretKeyRef:
                  name: coder-db-url
                  key: url
        - name: CODER_ACCESS_URL
          value: '${access_url}'
        - name: CODER_WILDCARD_ACCESS_URL
          value: '${wildcard_url}'
    service:
        type: ClusterIP
    ingress:
        enable: true
        className: traefik
        host: '${host}'
        wildcardHost: '${wildcard_host}'
        # Lowest priority: the *.<domain> catch-all becomes a long HostRegexp rule that
        # Traefik ranks first by default, shadowing rancher., argocd., ... on the same domain.
        annotations:
            traefik.ingress.kubernetes.io/router.priority: '1'
            traefik.ingress.kubernetes.io/router.entrypoints: 'web,websecure'
            traefik.ingress.kubernetes.io/router.tls: 'false'
            traefik.ingress.kubernetes.io/router.middlewares: '${middlewares}'
