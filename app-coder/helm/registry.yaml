# In-cluster image registry (registry:2, anonymous, plain HTTP) with a PVC, on
# hostPort ${registry_port} so BuildKit (pods) and containerd (kubelet) reach it as
# <node ip>:<port>. ${registry_port} is filled in by run.sh.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: registry-data
spec:
    accessModes: [ReadWriteOnce]
    resources:
        requests:
            storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
    name: registry
spec:
    replicas: 1
    strategy:
        type: Recreate
    selector:
        matchLabels:
            app: registry
    template:
        metadata:
            labels:
                app: registry
        spec:
            containers:
                - name: registry
                  image: registry:2
                  ports:
                      - containerPort: 5000
                        hostPort: ${registry_port}
                  env:
                      - name: REGISTRY_STORAGE_DELETE_ENABLED
                        value: 'true'
                  volumeMounts:
                      - name: data
                        mountPath: /var/lib/registry
            volumes:
                - name: data
                  persistentVolumeClaim:
                      claimName: registry-data
---
apiVersion: v1
kind: Service
metadata:
    name: registry
spec:
    selector:
        app: registry
    ports:
        - port: 5000
          targetPort: 5000
