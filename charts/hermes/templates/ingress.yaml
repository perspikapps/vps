{{/* @format */}}
{{- if .Values.dashboard.ingress.enabled }}
{{ include "vps-lib.ingress" (dict "ctx" . "app" "hermes" "ingress" .Values.dashboard.ingress "name" (include "hermes.fullname" .) "service" (include "hermes.fullname" .) "port" "dashboard" "className" .Values.dashboard.ingress.className "labels" (include "hermes.labels" .) "tlsSecret" (ternary (printf "%s-tls" (include "hermes.fullname" .)) "" (ne (.Values.dashboard.ingress.tlsIssuer | default "") ""))) }}
{{- end }}
