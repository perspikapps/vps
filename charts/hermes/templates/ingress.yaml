{{/* @format */}}
{{- if .Values.dashboard.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "hermes.fullname" . }}
    labels:
        {{- include "hermes.labels" . | nindent 8 }}
    {{- if or .Values.dashboard.ingress.tlsIssuer (eq (.Values.dashboard.ingress.access | default "public") "internal") }}
    annotations:
        {{- if .Values.dashboard.ingress.tlsIssuer }}
        cert-manager.io/cluster-issuer: {{ .Values.dashboard.ingress.tlsIssuer }}
        {{- end }}
        {{- if eq (.Values.dashboard.ingress.access | default "public") "internal" }}
        traefik.ingress.kubernetes.io/router.middlewares: kube-system-internal-only@kubernetescrd
        {{- end }}
    {{- end }}
spec:
    ingressClassName: {{ .Values.dashboard.ingress.className }}
    rules:
        - host: {{ include "hermes.host" . }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "hermes.fullname" . }}
                            port:
                                name: dashboard
    {{- if .Values.dashboard.ingress.tlsIssuer }}
    tls:
        - hosts:
              - {{ include "hermes.host" . }}
          secretName: {{ include "hermes.fullname" . }}-tls
    {{- end }}
{{- end }}
