{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-cognee
    {{- if or .Values.ingress.annotations (eq (.Values.ingress.access | default "public") "internal") }}
    annotations:
        {{- with .Values.ingress.annotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if eq (.Values.ingress.access | default "public") "internal" }}
        traefik.ingress.kubernetes.io/router.entrypoints: internalsecure
        traefik.ingress.kubernetes.io/router.tls: "true"
        {{- end }}
    {{- end }}
spec:
    ingressClassName: {{ .Values.ingress.ingressClassName }}
    rules:
        - host: {{ include "cognee.host" . }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ .Release.Name }}-cognee
                            port:
                                number: {{ .Values.service.port }}
    {{- if .Values.ingress.tls }}
    tls:
        - hosts:
              - {{ include "cognee.host" . }}
          secretName: {{ .Release.Name }}-cognee-tls
    {{- end }}
{{- end }}
