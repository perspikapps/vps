{{/* @format */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-argocd
    {{- if eq (.Values.ingress.access | default "public") "internal" }}
    annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: internalsecure
        traefik.ingress.kubernetes.io/router.tls: "true"
    {{- end }}
spec:
    ingressClassName: {{ .Values.ingress.className }}
    rules:
        - host: {{ include "argocd.host" . }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            # argo-cd.fullnameOverride is pinned in values.yaml
                            name: argocd-server
                            port:
                                number: 80
{{- end }}
