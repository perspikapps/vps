{{/* @format */}}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ .Release.Name }}-coder
spec:
    ingressClassName: {{ .Values.ingress.className }}
    rules:
        - host: {{ include "coder.host" . }}
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: coder
                            port:
                                number: 80
{{- end }}
