# @format
# Values here are passed straight through to the upstream `coder` chart
# under the `coder:` key (Helm's standard subchart-values convention).
# Upstream's own values root is also `coder:`, hence `coder.coder.*` below.
#
# Upstream chart's full value reference:
# https://github.com/coder/coder/blob/main/helm/coder/values.yaml

# Server domain for the Ingress: apps are served at <app>.<global.domain>.
# Left empty it is derived from Rancher's own server URL (global.cattle.url,
# injected on install); a bare IP there becomes <ip>.nip.io.
global:
    domain: ''
    cattle:
        url: ''

ingress:
    enabled: true
    className: traefik
    # Traefik middlewares of the route (annotation router.middlewares). Empty = public. For an
    # internal route use kube-system-internal-only@kubernetescrd (created by svc-k3s) and an internal
    # host (global.domain or host): clients of the internal network only.
    middlewares: ''
    # Override the generated <app>.<domain> host.
    host: ''
    # Also route *.<domain> to Coder (workspace apps on subdomains). Set CODER_WILDCARD_ACCESS_URL
    # below to "*.<domain>" too, with CODER_ACCESS_URL under that domain.
    wildcard: true

coder:
    coder:
        env:
            # Required: Coder needs a Postgres database to store its state.
            # Point this at a database you've already provisioned (this
            # chart does not bundle one) - e.g. a `postgresql://` URL, ideally
            # sourced from a Secret rather than inlined here:
            # https://coder.com/docs/admin/setup#postgresql-database
            - name: CODER_PG_CONNECTION_URL
              valueFrom:
                  secretKeyRef:
                      name: coder-db-url
                      key: url

            # Set to the Ingress URL, http://coder.<your server domain>. Left
            # unset, Coder opens a public tunnel instead:
            # - name: CODER_ACCESS_URL
            #   value: "http://coder.example.com"
            # - name: CODER_WILDCARD_ACCESS_URL
            #   value: "*.example.com"

        service:
            # Exposed through this chart's own Ingress (see top of file).
            type: ClusterIP
